# MINIMUM — Automated preseed install VM
#   Fully unattended Debian install via the preseed pipeline.
#   Requires: build-debian-preseed-iso.yml run first.
#   Boot order must start with ide2 (the preseed ISO).
#   preseed_hostname defaults to the VM name if omitted or left empty.
#- name: "my-auto-vm"
#  vmid: 602
#  boot: "order=ide2;scsi0;net0"
#  bootdisk: scsi0
#  memory: 1024
#  cores: 2
#  net0: "virtio,bridge=vmbr0"
#  ostype: "l26"
#  agent: 1
#  disk_size_gb: 32
#  storage: "local-lvm"
#  iso_storage: "local"
#  iso_path: "iso/"
#  iso_file: "debian-13-amd64-preseed.iso"
#  preseed_install: true
#  # preseed_hostname: "my-auto-vm"    # omit to use 'name' above as hostname
#  # preseed_ip: "192.168.0.x"         # omit for DHCP
#  # preseed_gateway: "192.168.0.1"    # required if preseed_ip is set

# Preseed auto-install example — kept as reference/documentation only.
# NOTE: create-vm-from-iso-proxmox.yml creates a shell for EVERY entry in this
# list regardless of preseed_install, so this block must stay commented out
# (not just preseed_install: false) or re-running that playbook recreates
# VMID 500 in Proxmox again.
# - name: "ansible-debian-01"
#   vmid: 500
#   # Boot from ISO first, then disk (preseed auto-install)
#   boot: "order=ide2;scsi0;net0"
#   bootdisk: scsi0
#   onboot: false
#   memory: 1024
#   cores: 2
#   net0: "virtio,bridge=vmbr0"
#   ostype: "l26"
#   agent: 1
#   disk_size_gb: 32
#   storage: "local-lvm"
#   iso_storage: "local"
#   iso_path: "iso/"
#   iso_file: "debian-13-amd64-preseed.iso"
#   preseed_install: true
#   preseed_ip: "192.168.0.206"
#   preseed_gateway: "192.168.0.1"
#   preseed_hostname: "dev-debian-01"

# ansible-stationctl "remote-workstation" — MATE workstation managed by
# https://github.com/BeanGreen247/ansible-stationctl after this playbook hands
# off. This is the ONLY place that sets its CPU/RAM — stationctl no longer
# has its own copy of these numbers (see its group_vars/workstations.yml).
# To resize the VM: change memory/cores below, then run:
#   ansible-playbook -i inventory/hosts.ini create-vm-from-iso-proxmox.yml --tags updateVMs
# (updateVMs only touches memory/cores/sockets/cpu/scsihw/net/ostype/agent/onboot —
# it does not touch the disk or CD-ROM.)
#
# disk_size_gb must stay DEFINED (not commented out): unlike the iso_* fields
# below, it has a fallback (vm_defaults.size_gb: 20) and the createDisks task
# (proxmox_disk, state: present) applies that fallback with no shrink guard —
# commenting it out would make a re-run silently attempt 20G against this
# VM's real 150G disk instead of leaving it alone. Confirmed via SSH into the
# guest (lsblk/df -h) that the real disk is still 150G, so the value below is
# accurate and a re-run of createDisks/updateVMs stays a no-op.
#
# iso_storage/iso_path/iso_file are removed entirely (not just commented out):
# the preseed CD-ROM (ide2) was detached after install and this VM currently
# has no CD-ROM drive at all, so there's no "current" ISO config left to match.
# Re-add all three (with values) only if you deliberately attach a CD-ROM again.
- name: "vm-debian-workstation-01"
  vmid: 115
  boot: "order=ide2;scsi0;net0"
  bootdisk: scsi0
  onboot: true
  memory: 4096
  cores: 2
  net0: "virtio,bridge=vmbr0"
  ostype: "l26"
  agent: 1
  # 150G: room for Docker image growth, IDEs, and future game-port build
  # trees on top of the ~13GB of dev tooling/projects that live here day
  # one. local-lvm thin pool has 788GB free, so this costs nothing until
  # actually used. (First real build used 48G and had to be grown live —
  # see setup-base-debian.yml's swapfile-vs-partition note for why the
  # preseed layout below matters just as much as the size.)
  disk_size_gb: 150
  cpu: "host"
  storage: "vm-8tb-hdd0"
  preseed_install: true
  preseed_ip: "192.168.0.162"
  preseed_gateway: "192.168.0.1"
  preseed_hostname: "workstation-01"
